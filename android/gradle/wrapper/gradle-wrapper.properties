distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Points at a mirror rather than services.gradle.org on purpose.
#
# Two independent reasons, both measured on the machine this was set up on:
#   * services.gradle.org serves at ~260 KB/s here, so the 230 MB "-all"
#     distribution takes a quarter of an hour, and Gradle's own downloader
#     stalled outright (0 bytes after 45s) while curl was still transferring.
#   * the Tencent mirror serves the same file at ~1.2 MB/s.
#
# "-bin" instead of "-all" is the other half: "-all" only adds Gradle's own
# sources and docs for IDE browsing, which the Android Studio Gradle plugin can
# fetch separately if you ever want it. The binaries are what a build needs.
#
# To go back to the official distribution, restore:
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
