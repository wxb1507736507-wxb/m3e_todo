name: m3e_todo
description: "A Material 3 Expressive todo app for Windows desktop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

# Deliberately dependency-light:
#  * flutter_riverpod      - state management + dependency injection
#  * (no plugin packages)  - persistence is plain dart:io JSON, so the app does
#    not require Windows Developer Mode for plugin symlinks.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
