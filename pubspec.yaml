name: m3e_todo
description: "A Material 3 Expressive todo app for Windows desktop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

# Deliberately dependency-light:
#  * flutter_riverpod      - state management + dependency injection
#  * flutter_localizations - SDK package, not a hosted one. AppStrings holds every
#    line of *this app's* text, but the platform surfaces (the date picker behind
#    every due date, mainly) are drawn by Material and would otherwise be English
#    inside a Chinese UI. It is the one addition that reaches outside the SDK.
#  * (no plugin packages)  - persistence is plain dart:io JSON, so the app does
#    not require Windows Developer Mode for plugin symlinks.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
